  allowed-brands:
    - "vanilla"
    - "fabric"
    - "forge"
    - "neoforge"
    - "feather"
    - "lunarclient"
    - "badlion"
    - "labymod"
    - "quilt"

  allowed-mods:
    - "minecraft"
    - "forge"
    - "neoforge"
    - "fabric"
    - "fabricloader"
    - "sodium"
    - "iris"
    - "optifine"
    - "jei"
    - "rei"
    - "emi"
    - "appleskin"
