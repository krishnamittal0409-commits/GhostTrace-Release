# ================================================================
#                 RESOURCE PACK VERIFICATION
# ================================================================
resource-pack:
  enforce-server-pack: false
  on-declined-action: "KICK"
  decline-message: "&cYou must accept the server resource pack to play on this server."

# Storage & Logging
logging:
  log-to-console: true
  log-to-file: true
  history-file: "history.yml"
