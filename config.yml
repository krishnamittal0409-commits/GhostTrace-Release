# ================================================================
#                       GhostTrace Configuration
#         Server-Side Client Mod & Payload Inspector Anti-Cheat
#         Author: Krishna Mittal | All Rights Reserved
# ================================================================

# General Settings
settings:
  # Prefix for chat and broadcast messages
  prefix: "&8[&bGhost&3Trace&8]&r "
  
  # Enforcement Mode:
  # BLACKLIST -> Blocks only items listed in prohibited sections
  # WHITELIST -> Blocks ANY mod or brand NOT explicitly in allowed sections
  # MONITOR   -> Logs and alerts staff only, does not kick or ban players
  mode: "BLACKLIST"

  # Primary Server Timezone for bans, infractions, and system logs.
  # Options:
  #   - "IST"  (Asia/Kolkata, UTC+05:30) - Primary
  #   - "UTC"  (Coordinated Universal Time, UTC+00:00)
  #   - "EST"  (America/New_York, UTC-05:00)
  #   - "CST"  (America/Chicago, UTC-06:00)
  #   - "PST"  (America/Los_Angeles, UTC-08:00)
  #   - "GMT"  (Europe/London, UTC+00:00)
  #   - "CET"  (Europe/Berlin, UTC+01:00)
  #   - "JST"  (Asia/Tokyo, UTC+09:00)
  #   - "AEST" (Australia/Sydney, UTC+10:00)
  timezone: "IST"

  # Default Action when a violation is detected:
  # DECIDER     -> Courtroom mode! Creates case in /gt cases for staff to review/ruling (Zero auto-kicks)
  # KICK        -> Disconnects player with the custom message below
  # BAN         -> Permanently bans the player from the server
  # NOTIFY_ONLY -> Broadcasts an alert to online admins
  # LOG_ONLY    -> Only saves the violation to history.yml
  action: "DECIDER"

  # Delay (in server ticks) before executing verification on join.
  # Gives handshake packets 1-2 ticks to fully register.
  scan-delay-ticks: 2

  # Active MC-265322 translation probe on join:
  # Probes clients automatically upon connection using the DonutSMP translation vulnerability
  # to reveal hidden Fabric/Forge cheats (Meteor, X-Ray, Freecam, Radars).
  # Can also be launched on-demand via /gt probe <player> or in /gt cases.
  active-probe-on-join: true
  probe-delay-seconds: 1

# ================================================================
#                       BYPASS CONFIGURATION
# Players or IDs listed here will NOT be tracked, scanned, or logged.
# ================================================================
bypass:
  exempt-players:
    - "YourAdminNameHere"
    - "00000000-0000-0000-0000-000000000000"

  exempt-ips:
    - "127.0.0.1"

# ================================================================
#         MOD VERSION ENFORCEMENT & REMOTE DISABLER
# Force-disable specific mods or mandate minimum required versions.
# Rules format: "<mod_id>:DISABLED" or "<mod_id>:<minimum_version>"
# ================================================================
version-control:
  enabled: true

  # Kick screen message prompting player to update
  update-required-message: |-
    &c&l[GhostTrace Mod Version Notice]
    
    &7Your version of &e%mod% &7(&c%current_version%&7) is outdated or disabled.
    &aPlease update to &b%required_version% &aor newer to connect to this server.
    &8Logged at: &7%timestamp_detailed%

  enforced-mods:
    - "simple-voice-chat:2.5.0"
    - "sodium:0.5.8"
    - "iris:1.7.0"
    - "outdated_client_mod:DISABLED"

# ================================================================
#                 REPEATED ATTEMPTS IP-BAN CONDITION
# Note: By default, this is SET TO FALSE (disabled). It will NOT work
# until the admin directly edits this to 'true' in this config file
# and restarts the server!
# ================================================================
ip-ban-on-attempts:
  enabled: false
  max-attempts: 20

  ban-ip-reason: |-
    &c&l[GhostTrace Security System]
    
    &cYour IP has been permanently banned from this network.
    &7Reason: Exceeded %max_attempts% connection attempts with prohibited mods/clients.
    &7Offending Client / Modifications:
    %illegal_mods%
    &7Incident Time: &f%timestamp_detailed%

# ================================================================
#                  HISTORICAL SESSION LOGGING
# Saves exact timestamps, loaded mods, client brands, and IP
# addresses for every player session (browsable in /gt gui).
# ================================================================
session-logging:
  enabled: true
  max-sessions-per-player: 50
  log-clean-sessions: true

# Customizable Messages
messages:
  kick-reason: |-
    &cDisconnected by Server
    
    &7Prohibited client modification(s) detected:
    %illegal_mods%
    
    &7Please remove all prohibited modifications before rejoining.
  
  ban-reason: |-
    &cPermanently Banned by Server
    
    &7Prohibited client modification(s) detected:
    %illegal_mods%
    
    &7Timestamp: &f%timestamp%
  
  admin-alert: "&8[&bGhostTrace&8] &cViolation: &e%player% &7flagged for &c%illegal_item% &8(%category%) &8| &7Client: &b%brand%"
  ip-ban-alert: "&8[&bGhostTrace&8] &4IP-Ban: &e%player% &7(IP: &f%ip%&7) banned after %attempts% failed attempts."
  no-permission: "&cYou do not have permission to execute this command."
  reload-success: "&aGhostTrace configuration reloaded successfully."

